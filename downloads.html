<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoPortal - Área de Downloads</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navbar Responsiva -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <i class="ph-bold ph-compass text-primary fs-4"></i> GeoPortal
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2" href="index.html">
              <i class="ph ph-house fs-5"></i> Início
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2" href="galeria.html">
              <i class="ph ph-image fs-5"></i> Galeria
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active d-flex align-items-center gap-2" href="downloads.html">
              <i class="ph ph-download-simple fs-5"></i> Downloads
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Cabeçalho Centralizado no Topo -->
  <div class="w-100 bg-white border-bottom py-4 mb-4 text-center">
    <div class="container">
      <h1 class="h2 fw-bold text-dark mb-1">Área de Downloads de Vetores</h1>
      <p class="text-muted mb-0 mx-auto" style="max-width: 650px;">
        Baixe conjuntos de dados geoespaciais oficiais em formatos padrão SIG para processamento e análises territoriais.
      </p>
    </div>
  </div>

  <!-- Conteúdo Principal: lista de camadas (gerada por js/downloads.js) -->
  <main class="container pb-5 flex-grow-1 d-flex justify-content-center">
    <div class="dl-list w-100" style="max-width: 900px;">
      <div class="dl-header bg-dark text-white">
        <span class="fw-semibold d-flex align-items-center gap-2">
          <i class="ph ph-stack text-primary fs-5"></i> Camadas disponíveis
        </span>
        <button type="button" id="btnBaixarTudo" class="btn btn-light btn-sm d-inline-flex align-items-center gap-2">
          <i class="ph ph-file-zip"></i> Baixar tudo (.zip)
        </button>
      </div>
      <div id="dlItems">
        <noscript><p class="p-4 mb-0 text-muted">Ative o JavaScript para ver a lista de camadas.</p></noscript>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    <div class="container">
      <small>&copy; GeoPortal - Todos os direitos reservados.</small>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dados (usados só para contar feições e detectar o tipo de geometria) -->
  <script src="dados/acudes.js"></script>
  <script src="dados/bacias.js"></script>
  <script src="dados/municipios.js" charset="utf-8"></script>
  <script src="dados/rios.js"></script>
  <script src="dados/pocos_pb.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
