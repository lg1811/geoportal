<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoPortal - Início</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet Control Search CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.5/dist/leaflet-search.min.css" />
  <!-- Geoman (Leaflet.pm) CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <!-- Leaflet MarkerCluster (agrupa os poços) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="map-page d-flex flex-column vh-100 m-0 p-0 bg-light">

  <!-- Navbar Responsiva Bootstrap -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm z-3 flex-shrink-0">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <i class="ph-bold ph-compass text-primary fs-4"></i> GeoPortal
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item">
            <a class="nav-link active d-flex align-items-center gap-2" href="index.html">
              <i class="ph ph-house fs-5"></i> Início
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2" href="galeria.html">
              <i class="ph ph-image fs-5"></i> Galeria
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2" href="downloads.html">
              <i class="ph ph-download-simple fs-5"></i> Downloads
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal (Mapa em Tela Cheia ocupando o espaço flexível) -->
  <main class="flex-grow-1 position-relative w-100 m-0 p-0 overflow-hidden">
    
    <!-- Painel Lateral Flutuante de Camadas (Sidebar/Drawer) -->
    <div id="layerSidebar" class="layer-sidebar shadow-lg rounded-3 collapsed">
      <div class="layer-sidebar-header d-flex align-items-center justify-content-between px-3 py-2 bg-dark text-white">
        <span class="fw-semibold d-flex align-items-center gap-2">
          <i class="ph ph-stack text-primary fs-5"></i> Gestão de Camadas
        </span>
        <button type="button" id="closeSidebarBtn" class="btn btn-sm btn-outline-light border-0">
          <i class="ph ph-x fs-6"></i>
        </button>
      </div>

      <div class="layer-sidebar-body sidebar-body">
        <div class="accordion accordion-flush layer-accordion" id="sidebarAccordion">

          <!-- 1. CAMADAS (aberta por padrão) -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#secCamadas" aria-expanded="true" aria-controls="secCamadas">
                <i class="ph ph-stack me-2"></i> Camadas
              </button>
            </h2>
            <div id="secCamadas" class="accordion-collapse collapse show">
              <div class="accordion-body p-2">

                <!-- Município -->
                <div class="layer-row">
                  <div class="layer-row-main">
                    <span class="layer-swatch" style="background:#64748b; border:1px solid #475569;"></span>
                    <label class="layer-name" for="checkMunicipios">Municípios</label>
                    <button class="layer-expand" type="button" data-bs-toggle="collapse" data-bs-target="#opMun" aria-expanded="false" aria-label="Opacidade de Municípios" title="Opacidade">
                      <i class="ph ph-sliders-horizontal"></i>
                    </button>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="checkMunicipios" checked></div>
                  </div>
                  <div class="collapse layer-opacity" id="opMun">
                    <div class="d-flex justify-content-between small text-secondary"><span>Opacidade</span><span id="valOpMun">15%</span></div>
                    <input type="range" class="form-range opacity-slider-input" id="rangeOpMun" min="0" max="1" step="0.05" value="0.15">
                  </div>
                </div>

                <!-- Açudes -->
                <div class="layer-row">
                  <div class="layer-row-main">
                    <span class="layer-swatch rounded-circle" style="background:#0284c7;"></span>
                    <label class="layer-name" for="checkAcudes">Açudes</label>
                    <button class="layer-expand" type="button" data-bs-toggle="collapse" data-bs-target="#opAcu" aria-expanded="false" aria-label="Opacidade de Açudes" title="Opacidade">
                      <i class="ph ph-sliders-horizontal"></i>
                    </button>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="checkAcudes" checked></div>
                  </div>
                  <div class="collapse layer-opacity" id="opAcu">
                    <div class="d-flex justify-content-between small text-secondary"><span>Opacidade</span><span id="valOpAcu">60%</span></div>
                    <input type="range" class="form-range opacity-slider-input" id="rangeOpAcu" min="0" max="1" step="0.05" value="0.60">
                  </div>
                </div>

                <!-- Bacias -->
                <div class="layer-row">
                  <div class="layer-row-main">
                    <span class="layer-swatch" style="background:#16a34a;"></span>
                    <label class="layer-name" for="checkBacias">Bacias Hidrográficas</label>
                    <button class="layer-expand" type="button" data-bs-toggle="collapse" data-bs-target="#opBac" aria-expanded="false" aria-label="Opacidade de Bacias" title="Opacidade">
                      <i class="ph ph-sliders-horizontal"></i>
                    </button>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="checkBacias"></div>
                  </div>
                  <div class="collapse layer-opacity" id="opBac">
                    <div class="d-flex justify-content-between small text-secondary"><span>Opacidade</span><span id="valOpBac">45%</span></div>
                    <input type="range" class="form-range opacity-slider-input" id="rangeOpBac" min="0" max="1" step="0.05" value="0.45">
                  </div>
                </div>

                <!-- Rios -->
                <div class="layer-row">
                  <div class="layer-row-main">
                    <span class="layer-swatch layer-swatch-line" style="background:#0284c7;"></span>
                    <label class="layer-name" for="checkRios">Rios</label>
                    <button class="layer-expand" type="button" data-bs-toggle="collapse" data-bs-target="#opRio" aria-expanded="false" aria-label="Opacidade de Rios" title="Opacidade">
                      <i class="ph ph-sliders-horizontal"></i>
                    </button>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="checkRios"></div>
                  </div>
                  <div class="collapse layer-opacity" id="opRio">
                    <div class="d-flex justify-content-between small text-secondary"><span>Opacidade</span><span id="valOpRio">80%</span></div>
                    <input type="range" class="form-range opacity-slider-input" id="rangeOpRio" min="0" max="1" step="0.05" value="0.80">
                  </div>
                </div>


                <!-- Poços -->
                <div class="layer-row">
                  <div class="layer-row-main">
                    <span class="layer-swatch rounded-circle" style="background:#d97706; border:2px solid #ffffff; box-shadow:0 0 0 1px #d97706;"></span>
                    <label class="layer-name" for="checkPocos">Poços</label>
                    <button class="layer-expand" type="button" data-bs-toggle="collapse" data-bs-target="#opPoc" aria-expanded="false" aria-label="Opacidade de Poços" title="Opacidade">
                      <i class="ph ph-sliders-horizontal"></i>
                    </button>
                    <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="checkPocos"></div>
                  </div>
                  <div class="collapse layer-opacity" id="opPoc">
                    <div class="d-flex justify-content-between small text-secondary"><span>Opacidade</span><span id="valOpPoc">100%</span></div>
                    <input type="range" class="form-range opacity-slider-input" id="rangeOpPoc" min="0" max="1" step="0.05" value="1">
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- 2. MAPA DE FUNDO (fechada) -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#secFundo" aria-expanded="false" aria-controls="secFundo">
                <i class="ph ph-image me-2"></i> Mapa de fundo
              </button>
            </h2>
            <div id="secFundo" class="accordion-collapse collapse">
              <div class="accordion-body p-2">
                <div class="basemap-grid">
                  <label class="basemap-option">
                    <input type="radio" name="basemapRadio" id="radioOsm">
                    <span class="basemap-card"><i class="ph ph-map-trifold"></i><span>OpenStreetMap</span></span>
                  </label>
                  <label class="basemap-option">
                    <input type="radio" name="basemapRadio" id="radioSat" checked>
                    <span class="basemap-card"><i class="ph ph-globe-hemisphere-west"></i><span>Google Satélite</span></span>
                  </label>
                  <label class="basemap-option">
                    <input type="radio" name="basemapRadio" id="radioDark">
                    <span class="basemap-card"><i class="ph ph-moon"></i><span>CartoDB Escuro</span></span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- 3. CONSULTA POR COORDENADAS (fechada) -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#secCoord" aria-expanded="false" aria-controls="secCoord">
                <i class="ph ph-crosshair me-2"></i> Consulta por coordenadas
              </button>
            </h2>
            <div id="secCoord" class="accordion-collapse collapse">
              <div class="accordion-body p-3">
                <div class="mb-2">
                  <label for="coordTypeSelect" class="form-label text-secondary fw-semibold" style="font-size: 11px;">Sistema / Formato</label>
                  <select id="coordTypeSelect" class="form-select form-select-sm">
                    <option value="dec" selected>Graus Decimais (Lat/Long)</option>
                    <option value="dms">Graus, Minutos, Segundos (DMS)</option>
                    <option value="utm">UTM (Proj. Universal)</option>
                  </select>
                </div>

                <div id="coordInputsContainer">
                  <div class="row g-2 mb-2" id="groupDec">
                    <div class="col-6">
                      <label for="inputLatDec" class="form-label text-muted" style="font-size: 10px;">Latitude (-)</label>
                      <input type="text" class="form-control form-control-sm" id="inputLatDec" placeholder="Ex: -7.1198">
                    </div>
                    <div class="col-6">
                      <label for="inputLonDec" class="form-label text-muted" style="font-size: 10px;">Longitude (-)</label>
                      <input type="text" class="form-control form-control-sm" id="inputLonDec" placeholder="Ex: -34.8450">
                    </div>
                  </div>
                </div>

                <button type="button" id="btnLocalizarCoord" class="btn btn-primary btn-sm w-100 d-flex align-items-center justify-content-center gap-1 mt-2">
                  <i class="ph ph-crosshair fs-6"></i> Localizar Ponto
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Container do Mapa -->
    <div id="map" class="w-100 h-100 position-absolute top-0 start-0"></div>
  </main>

  <!-- Painel Lateral de Atributos (Offcanvas) -->
  <div class="offcanvas offcanvas-end shadow-lg" tabindex="-1" id="attributeOffcanvas" aria-labelledby="attributeOffcanvasLabel" style="width: 380px;">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title d-flex align-items-center gap-2 fs-6 fw-semibold" id="attributeOffcanvasLabel">
        <i class="ph ph-info text-primary fs-5"></i> Detalhes da Feição
      </h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="offcanvasContent">
      <div class="text-center text-muted my-5">
        <i class="ph ph-cursor-click fs-1 d-block mb-2 text-secondary"></i>
        <p class="small">Clique em qualquer município, bacia ou açude no mapa para visualizar sua ficha técnica completa.</p>
      </div>
    </div>
  </div>

  <!-- Painel da Tabela de Atributos Interativa -->
  <div id="attributeTablePanel" class="attribute-table-panel shadow-lg closed">
    <div class="table-panel-header bg-dark text-white d-flex align-items-center justify-content-between px-3 py-2">
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold d-flex align-items-center gap-2 small">
          <i class="ph ph-table text-primary"></i> Tabela de Atributos
        </span>
        <!-- Seletor para alternar qual camada exibir na tabela -->
        <select id="layerTableSelect" class="form-select form-select-sm bg-secondary text-white border-0 py-0" style="font-size: 11px; width: 160px;">
          <option value="municipios">Municípios</option>
          <option value="acudes">Açudes</option>
          <option value="bacias">Bacias Hidrográficas</option>
          <option value="rios">Rios</option>
          <option value="pocos">Poços</option>
        </select>
      </div>
      <button type="button" id="closeTableBtn" class="btn btn-sm btn-close btn-close-white"></button>
    </div>
    <div class="table-panel-body bg-white p-0 overflow-auto" style="height: 220px;">
      <table class="table table-sm table-hover table-striped mb-0 small" id="gisAttributeTable">
        <thead class="table-light sticky-top" id="gisTableHead">
          <!-- Cabeçalho gerado dinamicamente -->
        </thead>
        <tbody id="gisTableBody">
          <!-- Dados inseridos dinamicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-search@3.0.5/dist/leaflet-search.min.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="dados/acudes.js"></script>
  <script src="dados/bacias.js"></script>
  <script src="dados/municipios.js" charset="utf-8"></script>
  <script src="dados/rios.js"></script>
  <script src="dados/pocos_pb.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
